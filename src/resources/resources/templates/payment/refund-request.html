<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Request Refund - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="mb-4">
                <span class="badge bg-danger px-3 py-2 rounded-pill fw-bold mb-2">100% Refund Policy</span>
                <h3 class="fw-bold">Request Tour Refund</h3>
                <p class="text-muted small">Our standard company policy provides a full 100% refund for cancelled verified bookings upon Finance Officer review.</p>
            </div>

            <!-- Booking & Payment Details -->
            <div class="p-3 bg-light rounded-3 mb-4 small">
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted">Booking Reference:</span>
                    <span class="fw-bold" th:text="'#' + ${booking.id}">#1</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted">Package:</span>
                    <span class="fw-bold text-dark" th:text="${booking.packageName}">Tour Name</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted">Transaction ID:</span>
                    <span class="font-monospace" th:text="${payment.transactionId}">TXN-001</span>
                </div>
                <div class="d-flex justify-content-between pt-2 border-top">
                    <span class="fw-bold">Refundable Amount (100%):</span>
                    <span class="fw-bold text-danger fs-6" th:text="'LKR ' + ${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT')}">LKR 150,000</span>
                </div>
            </div>

            <form th:action="@{/customer/refund/request}" th:object="${refundDTO}" method="post">
                <input type="hidden" th:field="*{bookingId}">

                <div class="mb-4">
                    <label class="form-label fw-semibold">Reason for Cancellation & Refund</label>
                    <textarea th:field="*{reason}" class="form-control" rows="4"
                              th:classappend="${#fields.hasErrors('reason')} ? 'is-invalid' : ''"
                              maxlength="500" placeholder="e.g. Sudden medical emergency, flight cancellation, schedule conflict..." required></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/customer/booking/{id}(id=${booking.id})}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger fw-bold px-4">
                        <i class="bi bi-arrow-counterclockwise me-1"></i> Submit 100% Refund Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
