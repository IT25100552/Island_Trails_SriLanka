<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>My Payment History - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content">
    <div class="mb-4">
        <h1 class="h2 fw-bold mb-1">Payment Transactions & Receipts</h1>
        <p class="text-muted small">View proof of payment records, transaction identifiers, and invoices</p>
    </div>

    <div class="card shadow-sm rounded-4 p-4 bg-white">
        <div class="table-responsive" th:if="${not #lists.isEmpty(payments)}">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Payment #</th>
                        <th>Booking ID</th>
                        <th>Transaction ID</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th>Date Processed</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payments}">
                        <td class="fw-bold tabular-nums" th:text="'#' + ${p.id}">#1</td>
                        <td><a th:href="@{/customer/booking/{id}(id=${p.bookingId})}" class="fw-bold tabular-nums" th:text="'#' + ${p.bookingId}">#1</a></td>
                        <td><code class="text-dark tabular-nums" th:text="${p.transactionId}">TXN-001</code></td>
                        <td class="fw-bold text-primary tabular-nums" th:text="'LKR ' + ${#numbers.formatDecimal(p.amount, 0, 'COMMA', 2, 'POINT')}">LKR 150,000</td>
                        <td><span class="badge badge-subtle-neutral" th:text="${p.method}">CREDIT_CARD</span></td>
                        <td>
                            <span class="badge" th:classappend="${p.status.name() == 'VERIFIED' ? 'badge-subtle-success' : (p.status.name() == 'PENDING' ? 'badge-subtle-warning' : 'badge-subtle-danger')}" th:text="${p.status}">VERIFIED</span>
                        </td>
                        <td class="small text-muted tabular-nums" th:text="${p.processedAt != null ? #temporals.format(p.processedAt, 'yyyy-MM-dd HH:mm') : 'Pending'}">2026-08-29</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(payments)}" class="text-center py-5 text-muted">
            <p>No transaction history recorded.</p>
        </div>
    </div>
</div>
</body>
</html>
