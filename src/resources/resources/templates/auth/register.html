<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Customer Registration - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-compass display-4 text-warning mb-2 d-inline-block"></i>
                <h1 class="h3 fw-bold text-dark">Create an Account</h1>
                <p class="text-muted small">Join us to book Sri Lanka tours and custom itineraries</p>
            </div>

            <form th:action="@{/auth/register}" th:object="${registerDTO}" method="post">
                <div class="mb-3">
                    <label for="register-name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" id="register-name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           placeholder="Kasun Perera" required maxlength="100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="register-email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="register-email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="kasun@example.com" required maxlength="150">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="register-phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="text" id="register-phone" th:field="*{phoneNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                           placeholder="+94 77 123 4567" maxlength="25">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="••••••••" required minlength="6" maxlength="100">
                    <div id="password-hint" class="form-text text-muted small mt-1">
                        Minimum 6 characters
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">
                    <i class="bi bi-person-plus me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted small mb-0">Already registered? <a th:href="@{/auth/login}" class="text-primary fw-bold text-decoration-none">Log In</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
