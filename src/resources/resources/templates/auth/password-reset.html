<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Password Reset - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-key display-4 text-warning"></i>
                <h1 class="h3 fw-bold mt-2 text-dark">Reset Password</h1>
                <p class="text-muted small">Enter your email address to receive password recovery instructions</p>
            </div>

            <form th:action="@{/auth/password-reset}" method="post">
                <div class="mb-3">
                    <label for="reset-email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" id="reset-email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-3">
                    Send Reset Link
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a th:href="@{/auth/login}" class="text-muted small text-decoration-none">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
