<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="'Manage Ticket #' + ${ticket.id} + ' - Support Staff'">Manage Support Ticket</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="badge bg-danger px-3 py-2 rounded-pill mb-2" th:text="'Ticket #' + ${ticket.id}">#1</span>
            <h1 class="h2 fw-bold mb-1" th:text="${ticket.subject}">Subject</h1>
            <p class="text-muted small">Customer: <strong th:text="${ticket.customerName}">Customer</strong> (<span th:text="${ticket.customerEmail}">email</span>)</p>
        </div>
        <a th:href="@{/staff/support/tickets}" class="btn btn-outline-secondary">&larr; Back to Queue</a>
    </div>

    <div class="row g-4">
        <!-- Main Conversation & Reply -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold text-dark"><i class="bi bi-person-fill me-1"></i> <span th:text="${ticket.customerName}">Customer Name</span> (Inquiry Origin)</span>
                    <span class="text-muted small" th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                </div>
                <p class="text-muted" style="white-space: pre-line;" th:text="${ticket.description}">Description...</p>
            </div>

            <!-- Replies -->
            <div class="mb-4">
                <h2 class="h5 fw-bold mb-3"><i class="bi bi-chat-dots-fill text-primary me-2"></i> Message Thread</h2>

                <div th:if="${not #lists.isEmpty(replies)}" class="d-flex flex-column gap-3">
                    <div th:each="rep : ${replies}" class="card shadow-sm rounded-4 p-4"
                         th:classappend="${rep.isStaffReply ? 'bg-light border border-primary-subtle' : 'bg-white border border-light-subtle'}">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold" th:classappend="${rep.isStaffReply ? 'text-primary' : 'text-dark'}"
                                  th:text="${rep.repliedByName != null ? rep.repliedByName : 'User'}">Sender</span>
                            <span class="text-muted small" th:text="${#temporals.format(rep.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
                        </div>
                        <p class="text-muted mb-0 small" style="white-space: pre-line;" th:text="${rep.message}">Message...</p>
                    </div>
                </div>
            </div>

            <!-- Staff Reply Form -->
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white">
                <h2 class="h6 fw-bold mb-3"><i class="bi bi-reply-fill text-primary me-1"></i> Send Official Staff Reply</h2>
                <form th:action="@{/staff/support/ticket/{id}/reply(id=${ticket.id})}" method="post">
                    <div class="mb-3">
                        <textarea name="message" class="form-control" rows="4" placeholder="Write comprehensive response to customer..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">Replying automatically updates ticket to IN_PROGRESS status.</small>
                        <button type="submit" class="btn btn-warning fw-bold px-4">Send Customer Response</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Ticket Controls Sidebar -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 rounded-4 p-4 bg-white mb-4">
                <h2 class="h5 fw-bold mb-3">Ticket Status & Workflow</h2>

                <form th:action="@{/staff/support/ticket/{id}/status(id=${ticket.id})}" method="post" class="mb-3">
                    <label class="form-label small text-muted fw-bold">Update Lifecycle Status</label>
                    <div class="input-group">
                        <select name="status" class="form-select form-select-sm">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == ticket.status}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Update</button>
                    </div>
                </form>

                <form th:action="@{/staff/support/ticket/{id}/priority(id=${ticket.id})}" method="post" class="mb-3">
                    <label class="form-label small text-muted fw-bold">Adjust Priority SLA</label>
                    <div class="input-group">
                        <select name="priority" class="form-select form-select-sm">
                            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}" th:selected="${p == ticket.priority}"></option>
                        </select>
                        <button type="submit" class="btn btn-outline-dark btn-sm">Set</button>
                    </div>
                </form>

                <div class="pt-3 border-top d-flex flex-column gap-2">
                    <form th:action="@{/staff/support/ticket/{id}/assign(id=${ticket.id})}" method="post">
                        <button type="submit" class="btn btn-outline-primary btn-sm w-100">
                            <i class="bi bi-person-check me-1"></i> Assign to Me
                        </button>
                    </form>
                    <form th:action="@{/staff/support/ticket/{id}/spam(id=${ticket.id})}" method="post">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100" onclick="return confirm('Mark as SPAM (soft-delete)?')">
                            <i class="bi bi-trash me-1"></i> Soft Delete as Spam
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
