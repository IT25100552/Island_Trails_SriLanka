<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Manage Users & Staff - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-1">User & Staff Accounts</h1>
            <p class="text-muted small mb-0">Manage account roles, permissions, and soft-delete states</p>
        </div>
        <a th:href="@{/admin/user/new}" class="btn btn-warning fw-bold">
            <i class="bi bi-person-plus me-1"></i> Create Staff Account
        </a>
    </div>

    <div class="card shadow-sm rounded-4 p-4 bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name & Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Failed Logins</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-bold tabular-nums" th:text="'#' + ${u.id}">#1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${u.name}">Name</div>
                            <div class="small text-muted" th:text="${u.email}">email@example.com</div>
                        </td>
                        <td>
                            <form th:action="@{/admin/user/{id}/role(id=${u.id})}" method="post" class="d-inline-flex align-items-center gap-1">
                                <select name="role" class="form-select form-select-sm" onchange="this.form.submit()">
                                    <option th:each="r : ${allRoles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.status.name() == 'ACTIVE' ? 'badge-subtle-success' : 'badge-subtle-danger'}" th:text="${u.status}">ACTIVE</span>
                        </td>
                        <td>
                            <span class="tabular-nums" th:text="${u.failedLoginAttempts}">0</span>
                            <span th:if="${u.isAccountLocked()}" class="badge badge-subtle-danger ms-1">LOCKED</span>
                        </td>
                        <td class="small text-muted tabular-nums" th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'yyyy-MM-dd HH:mm') : 'Never'}">Never</td>
                        <td>
                            <div class="d-flex gap-1">
                                <form th:if="${u.status.name() == 'ACTIVE'}" th:action="@{/admin/user/{id}/deactivate(id=${u.id})}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to deactivate this account (soft delete)?')">Deactivate</button>
                                </form>
                                <form th:if="${u.status.name() == 'DEACTIVATED'}" th:action="@{/admin/user/{id}/reactivate(id=${u.id})}" method="post">
                                    <button type="submit" class="btn btn-outline-success btn-sm">Reactivate</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
