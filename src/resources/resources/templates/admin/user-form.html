<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Create Staff Account - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="mb-4">
                <h1 class="h2 fw-bold text-dark mb-1">Create New Staff Account</h1>
                <p class="text-muted small mb-0">Provision internal staff credentials with role authorization</p>
            </div>

            <form th:action="@{/admin/user/new}" th:object="${staffUserDTO}" method="post">
                <div class="mb-3">
                    <label for="staff-name" class="form-label fw-semibold">Staff Member Name</label>
                    <input type="text" id="staff-name" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           placeholder="e.g. Kasun Silva" required maxlength="100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="staff-email" class="form-label fw-semibold">Company Email Address</label>
                    <input type="email" id="staff-email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="kasun@islandtrails.lk" required maxlength="150">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="staff-role" class="form-label fw-semibold">Assigned Staff Role</label>
                    <select id="staff-role" th:field="*{role}" class="form-select"
                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''" required>
                        <option value="">-- Select Role --</option>
                        <option th:each="r : ${staffRoles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Contact Phone</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid' : ''"
                           placeholder="+94 77 000 0000" maxlength="25">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Initial Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="••••••••" required minlength="6" maxlength="100">
                    <div id="password-hint" class="form-text text-muted small mt-1">
                        Minimum 6 characters
                    </div>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4">Create Staff Member</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
