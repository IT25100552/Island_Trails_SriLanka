<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Plan Custom Trip - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <div class="mb-4">
                <h1 class="h2 fw-bold text-dark mb-1">Request a Custom Sri Lanka Itinerary</h1>
                <p class="text-muted small mb-0">Tell us your budget, travel dates, and dream destinations. Our travel consultants will build an itemized proposal for you.</p>
            </div>

            <form th:action="@{/customer/trip-request/new}" th:object="${tripRequestDTO}" method="post">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="req-budget" class="form-label fw-semibold">Target Budget (LKR)</label>
                        <input type="number" step="0.01" id="req-budget" th:field="*{budget}" class="form-control form-control-lg tabular-nums"
                               th:classappend="${#fields.hasErrors('budget')} ? 'is-invalid' : ''"
                               placeholder="e.g. 250000.00" required min="1">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="req-travelers" class="form-label fw-semibold">Number of Travelers</label>
                        <input type="number" id="req-travelers" th:field="*{numberOfTravelers}" class="form-control form-control-lg tabular-nums"
                               th:classappend="${#fields.hasErrors('numberOfTravelers')} ? 'is-invalid' : ''"
                               min="1" max="50" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('numberOfTravelers')}" th:errors="*{numberOfTravelers}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="req-start" class="form-label fw-semibold">Estimated Start Date</label>
                        <input type="date" id="req-start" th:field="*{startDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : ''"
                               th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="req-end" class="form-label fw-semibold">Estimated End Date</label>
                        <input type="date" id="req-end" th:field="*{endDate}" class="form-control"
                               th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid' : ''"
                               th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Interests & Travel Style (comma-separated)</label>
                    <input type="text" th:field="*{interests}" class="form-control" placeholder="e.g. wildlife, cultural heritage, trekking, beach relaxation, culinary">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Special Requests / Preferred Accommodations</label>
                    <textarea th:field="*{specialRequirements}" class="form-control" rows="4" placeholder="Detail any must-see landmarks, hotel preferences (e.g. boutique, 5-star, eco-lodges), language guide needs, or mobility requirements..."></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning btn-lg fw-bold px-4">
                        <i class="bi bi-send-check me-2"></i> Submit Custom Trip Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
