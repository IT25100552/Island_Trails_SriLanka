<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Manage Tour Packages - Tour Ops Manager</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-1">Tour Packages Catalog</h1>
            <p class="text-muted small mb-0">Create, edit, publish, and manage all tour package offerings</p>
        </div>
        <a th:href="@{/staff/tour-ops/package/new}" class="btn btn-warning fw-bold">
            <i class="bi bi-plus-circle me-1"></i> Add New Package
        </a>
    </div>

    <div class="card shadow-sm rounded-4 p-4 bg-white">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Package Name</th>
                        <th>Destination</th>
                        <th>Duration</th>
                        <th>Base Price</th>
                        <th>Origin</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pkg : ${packages}">
                        <td class="fw-bold tabular-nums" th:text="'#' + ${pkg.id}">#1</td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${pkg.name}">Sigiriya Tour</div>
                            <small class="text-muted tabular-nums" th:text="${#temporals.format(pkg.createdAt, 'yyyy-MM-dd')}">2026-08-29</small>
                        </td>
                        <td th:text="${pkg.destination}">Destination</td>
                        <td class="tabular-nums" th:text="${pkg.durationDays} + ' Days'">4 Days</td>
                        <td class="fw-bold text-primary tabular-nums" th:text="'LKR ' + ${#numbers.formatDecimal(pkg.basePrice, 0, 'COMMA', 2, 'POINT')}">LKR 75,000</td>
                        <td><span class="badge badge-subtle-neutral" th:text="${pkg.origin}">BROWSABLE</span></td>
                        <td>
                            <form th:action="@{/staff/tour-ops/package/{id}/status(id=${pkg.id})}" method="post" class="d-inline">
                                <select name="status" class="form-select form-select-sm" onchange="this.form.submit()"
                                        th:classappend="${pkg.status.name() == 'PUBLISHED' ? 'border-success' : (pkg.status.name() == 'DRAFT' ? 'border-warning' : 'border-danger')}">
                                    <option value="DRAFT" th:selected="${pkg.status.name() == 'DRAFT'}">DRAFT</option>
                                    <option value="PUBLISHED" th:selected="${pkg.status.name() == 'PUBLISHED'}">PUBLISHED</option>
                                    <option value="INACTIVE" th:selected="${pkg.status.name() == 'INACTIVE'}">INACTIVE</option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/catalog/package/{id}(id=${pkg.id})}" class="btn btn-outline-dark btn-sm">Preview</a>
                                <a th:href="@{/staff/tour-ops/package/{id}/edit(id=${pkg.id})}" class="btn btn-outline-primary btn-sm">Edit</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
