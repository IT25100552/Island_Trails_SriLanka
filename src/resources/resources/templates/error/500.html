<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>500 Server Error - Island Trails Lanka</title>
</head>
<body>
<div th:fragment="content" class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="card shadow-sm rounded-4 p-5 bg-white">
            <i class="bi bi-server text-danger display-1 mb-3"></i>
            <h1 class="h2 fw-bold text-dark mb-2">500 &middot; Internal Server Error</h1>
            <p class="lead text-muted mb-4" th:text="${message != null ? message : 'An internal processing error occurred.'}">Error</p>
            <div>
                <a th:href="@{/}" class="btn btn-primary fw-bold px-4">Return Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
